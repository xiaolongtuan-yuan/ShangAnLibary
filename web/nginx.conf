server {
    listen 80;
    server_name _;

    client_max_body_size 500m;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 文件流（签名 URL，后端校验后 X-Accel-Redirect 到 /protected/）
    location /api/files/stream/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 业务 API
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # PDF 文件直出（internal，仅允许 X-Accel-Redirect 内部跳转，原生支持 Range）
    location /protected/ {
        internal;
        alias /data/pdf/;
    }

    # 版本化静态资源（assets/v2/）：内容哈希文件名，可安全长缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # PDF.js worker（.mjs ES 模块）：确保 MIME 正确；
    # 缺失时返回 404 而非回退 index.html（否则浏览器拿到 text/html 报 "Failed to fetch dynamically imported module"）
    location ~* \.mjs$ {
        types { text/javascript mjs; }
        default_type text/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
