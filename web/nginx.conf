server {
    listen 80;
    server_name _;

    client_max_body_size 500m;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 鏂囦欢娴侊紙绛惧悕 URL锛屽悗绔牎楠屽悗 X-Accel-Redirect 鍒?/protected/锛?    location /api/files/stream/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 涓氬姟 API
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # PDF 鏂囦欢鐩村嚭锛坕nternal锛屼粎鍏佽 X-Accel-Redirect 鍐呴儴璺宠浆锛屽師鐢熸敮鎸?Range锛?    location /protected/ {
        internal;
        alias /data/pdf/;
    }

    # 鐗堟湰鍖栭潤鎬佽祫婧愶紙assets/v2/锛夛細鍐呭鍝堝笇鏂囦欢鍚嶏紝鍙畨鍏ㄩ暱缂撳瓨
    location /assets/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # PDF.js worker锛?mjs ES 妯″潡锛夛細纭繚 MIME 姝ｇ‘锛?    # 缂哄け鏃惰繑鍥?404 鑰岄潪鍥為€€ index.html锛堝惁鍒欐祻瑙堝櫒鎷垮埌 text/html 鎶?"Failed to fetch dynamically imported module"锛?    location ~* \.mjs$ {
        types { text/javascript mjs; }
        default_type text/javascript;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA 璺敱鍥為€€
    location / {
        try_files $uri $uri/ /index.html;
    }
}
